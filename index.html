<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structured Webpage</title>
    <style>
        /* Tag selector */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        
        /* ID selector */
        #header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        /* Class selector */
        .nav {
            background-color: #444;
            padding: 10px;
            text-align: center;
        }
        
        .nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        
        .section {
            padding: 20px;
            background-color: #fff;
            margin: 10px;
        }
        
        .article {
            margin-bottom: 20px;
        }
        
        .aside {
            background-color: #e9e9e9;
            padding: 20px;
            margin: 10px;
        }
        
        #footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        input {
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header id="header">
        <h1>My Webpage</h1>
    </header>
    
    <nav class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    
    <section class="section">
        <article class="article">
            <h2>Article Title</h2>
            <p>This is the main content of the article.</p>
            <!-- A. Variables and Output -->
            <p id="info">Name: Paul Benedict Sandy, Course: Web Development</p>
        </article>
        
        <!-- B. Button Function -->
        <button onclick="showAlert()">Click Me</button>
        
        <!-- C. User Input -->
        <input type="text" id="userInput" placeholder="Enter something">
        <p id="output"></p>
        
        <!-- D. Event Handling -->
        <button onclick="changeContent()">Change Content</button>
        <p id="dynamicContent">Original content</p>
    </section>
    
    <aside class="aside">
        <h3>Sidebar</h3>
        <p>Additional information here.</p>
    </aside>
    
    <footer id="footer">
        <p>&copy; 2026 My Webpage</p>
    </footer>
    
    <script>
        // A. Variables and Output - Already displayed in HTML
        
        // B. Button Function
        function showAlert() {
            alert("Button clicked!");
        }
        
        // C. User Input - Display input dynamically
        document.getElementById('userInput').addEventListener('input', function() {
            document.getElementById('output').textContent = 'You entered: ' + this.value;
        });
        
        // D. Event Handling - Change content dynamically
        function changeContent() {
            document.getElementById('dynamicContent').textContent = 'Content changed!';
        }
    </script>
</body>
</html>
